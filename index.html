    // --- 新機能: スイングスケルトン(線人間)描画コンポーネント ---
    function SwingSkeleton({ result }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        // キャンバスのクリア
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 背景に薄いグリッドとグラデーションを描写 (SF調)
        ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = 'rgba(51, 65, 85, 0.2)';
        ctx.lineWidth = 1;
        for(let i = 20; i < canvas.width; i += 20) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        const phase = result?.phase || 'アドレス';

        // --- 飛球線後方(Down the Line)の2Dプロジェクション座標の定義 ---
        // 画面の「右」が飛球線方向・胸側 / 「左」が背中側
        let hip = { x: 105, y: 175 };
        let neck = { x: 145, y: 125 };
        let head = { x: 155, y: 108 };
        let hand = { x: 145, y: 175 };
        let clubHead = { x: 195, y: 245 };
        let leftKnee = { x: 125, y: 210 };
        let leftFoot = { x: 130, y: 250 };
        let rightKnee = { x: 110, y: 210 };
        let rightFoot = { x: 105, y: 250 };

        // 各フェーズに応じた骨格トポロジー変化
        switch (phase) {
          case 'テイクバック':
            hand = { x: 130, y: 150 };
            clubHead = { x: 80, y: 140 };
            break;
          case 'トップ':
            hip = { x: 108, y: 175 };
            neck = { x: 143, y: 125 };
            head = { x: 153, y: 108 };
            hand = { x: 115, y: 95 }; // 頭の後ろ上方に手が収まる
            clubHead = { x: 175, y: 90 }; // シャフトがほぼ水平クロス
            leftKnee = { x: 120, y: 210 }; // 左膝が少し内に入る
            break;
          case 'ダウンスイング':
            hip = { x: 108, y: 178 }; // やや沈み込み
            neck = { x: 143, y: 128 };
            hand = { x: 135, y: 145 }; // インサイドから手が降りる
            clubHead = { x: 95, y: 115 }; // 強烈なタメ(ラグ)を表現
            break;
          case 'インパクト':
            hip = { x: 115, y: 173 }; // 腰がやや開き、前方へ
            neck = { x: 144, y: 125 };
            head = { x: 152, y: 110 }; // ビハインド・ザ・ボール
            hand = { x: 155, y: 170 }; // ハンドファースト(アドレスより右寄り)
            clubHead = { x: 195, y: 245 }; // 正確なインパクト
            leftKnee = { x: 130, y: 205 }; // 左足の壁・伸展
            break;
          case 'フォロースルー':
            hip = { x: 135, y: 170 }; // 体がターゲットに反転
            neck = { x: 150, y: 110 }; // 起き上がる
            head = { x: 155, y: 93 };
            hand = { x: 175, y: 110 }; // 右上に大きく振り抜き
            clubHead = { x: 120, y: 90 };  // 首の後ろに巻き付く
            leftKnee = { x: 135, y: 205 };
            rightKnee = { x: 130, y: 215 }; // 右膝が送り込まれる
            rightFoot = { x: 105, y: 248 }; // かかとが上がる
            break;
          default: // アドレス
            break;
        }

        // --- 描画レイヤー 1: アドレス時の基本シャフトプレーン(基準線) ---
        // アドレス時の手元(145, 175)からクラブヘッド(195, 245)を結ぶ直線を無限延長
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.25)'; // 薄い赤
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]); // 点線
        ctx.beginPath();
        // プレーン方程式を延長して直線描画
        ctx.moveTo(145 - 50, 175 - 50);
        ctx.lineTo(195 + 30, 245 + 30);
        ctx.stroke();
        ctx.setLineDash([]); // 点線リセット

        // --- 描画レイヤー 2: 下半身 (右足・左足) ---
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        
        // 右足 (奥側・やや暗め)
        ctx.strokeStyle = '#1e293b';
        ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(rightKnee.x, rightKnee.y); ctx.lineTo(rightFoot.x, rightFoot.y); ctx.stroke();
        
        // 左足 (手前側・エメラルド)
        ctx.strokeStyle = '#059669'; 
        ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(leftKnee.x, leftKnee.y); ctx.lineTo(leftFoot.x, leftFoot.y); ctx.stroke();

        // --- 描画レイヤー 3: 体幹 (脊椎) ---
        ctx.strokeStyle = '#f8fafc'; // ホワイト
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(hip.x, hip.y); ctx.lineTo(neck.x, neck.y); ctx.stroke();

        // --- 描画レイヤー 4: 頭部 ---
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 2;
        ctx.fillStyle = '#0f172a';
        ctx.beginPath(); ctx.arc(head.x, head.y, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        // --- 描画レイヤー 5: 腕 (アーム) ---
        ctx.strokeStyle = '#38bdf8'; // Sky 400
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(neck.x, neck.y); ctx.lineTo(hand.x, hand.y); ctx.stroke();

        // --- 描画レイヤー 6: クラブシャフト ＆ ヘッド ---
        // シャフト
        ctx.strokeStyle = '#fbbf24'; // Amber 400
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.lineTo(clubHead.x, clubHead.y); ctx.stroke();
        
        // クラブヘッド(シンボル)
        ctx.fillStyle = '#10b981'; // Emerald 500
        ctx.beginPath(); ctx.arc(clubHead.x, clubHead.y, 4.5, 0, Math.PI * 2); ctx.fill();

        // ボールマーク（アドレス・インパクト位置に固定設置）
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.beginPath(); ctx.arc(195, 248, 3, 0, Math.PI * 2); ctx.fill();

      }, [result]);

      return (
        <div className="flex flex-col items-center bg-slate-950 p-3 rounded-xl border border-slate-800/80 my-4 shadow-inner">
          <div className="w-full flex justify-between items-center px-1 mb-2">
            <span className="text-[10px] text-slate-400 font-extrabold uppercase tracking-wider flex items-center gap-1">
              <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-ping"></span>
              感覚のフォームトポロジー (飛球線後方ビュー)
            </span>
            <span className="text-[9px] bg-slate-900 border border-slate-800 text-slate-400 px-2 py-0.5 rounded font-bold">
              {result?.phase || 'アドレス'}
            </span>
          </div>
          <div className="relative">
            <canvas 
              ref={canvasRef} 
              width={290} 
              height={270} 
              className="bg-slate-900 rounded-lg border border-slate-850 shadow-md"
            />
            {/* プレーンの簡易注記ラベル */}
            <div className="absolute bottom-2 left-2 text-[9px] text-rose-500/80 font-bold">
              -- 赤破線: アドレスシャフト平面
            </div>
          </div>
        </div>
      );
    }

          setPinnedIds(['sample-1']);
        }
      }, []);

      const saveCardsToStorage = (updatedList) => {

        textArea.style.width = "2em"; textArea.style.height = "2em";
        textArea.style.padding = "0"; textArea.style.border = "none";
        textArea.style.outline = "none"; textArea.style.boxShadow = "none";
        textArea.style.background = "transparent";
        document.body.appendChild(textArea);
        textArea.focus(); textArea.select();
        
        try {
          const successful = document.execCommand('copy');
          if (successful) showToast('クリップボードにコピーしました！');
          else showToast('コピーに失敗しました。もう一度お試しください。', 'error');

${card.checkpoints.map((cp, idx) => `${idx + 1}. ${cp.label}: ${cp.value}\n   (${cp.description})`).join('\n')}

        const t = text.toLowerCase();
        if (t.includes("スライス") || t.includes("右") || t.includes("開く") || t.includes("脇") || t.includes("わき")) return "スライス防止";
        if (t.includes("フック") || t.includes("チーピン") || t.includes("左") || t.includes("閉じる")) return "フック防止";

              { label: "下半身の先行シフト量", value: "左側へ約10cmスライド", percentage: 90, description: "クラブがトップに到達する直前に下半身が始動することで、美しいラグ（タメ）を作ります。" },

            focusScore: 95, actionAdvice: "左足の踏み込みが完全に完了してから、引っ張られるようにクラブが下りてくる時間差を意識しましょう。"
          };
        }

        if (text.includes("手元") || text.includes("低く") || text.includes("下ろす") || text.includes("引き下ろす") || text.includes("ゴミ")) {
          return {
            phase: "ダウンスイング", issue: detectedIssue, translatedConcept: "インサイドシャロー",
            checkpoints: [
              { label: "グリップエンドの軌道", value: "真下へ直線的", percentage: 94, description: "手元を体の近く、かつ低い位置に引き下ろすことで、アウトサイドインのカット軌道を完全に抑え込みます。" },
              { label: "シャフトの倒れ角", value: "プレーンに対し約5°寝かせる", percentage: 88, description: "いわゆる『シャローイング』を誘発し、クラブが理想的なインサイドから入る通り道を作ります。" },
              { label: "左肘の向き", value: "左ポケット方向をキープ", percentage: 82, description: "肘が外に逃げる『チキンウィング』を防ぎ、インパクトに向けて腕が最大限伸展できるようにします。" }
            ],
            anatomyAndPhysics: "手元を低く下ろす意識は、遠心力に対抗する『向心力』を高めます。解剖学的には『広背筋』と『大円筋』の強力な収縮により、手元を身体の重心近くに通すことで、物理的な回転慣性モーメントを減少させます。",
            focusScore: 92, actionAdvice: "トップからグリップエンドで右足の太ももを突くような方向へ、直線的に引き下ろす感覚を試してください。"
          };
        }

        return {
          phase: "インパクト", issue: detectedIssue, translatedConcept: `体幹連鎖システム`,
          checkpoints: [
            { label: "軸の安定キープ", value: "ブレ幅極小", percentage: 85, description: "主観的感覚によって無駄な力みが抜け、スイングの回転軸が中心に固定されます。" },
            { label: "骨盤の回転角", value: "ターゲット方向に45度回転", percentage: 90, description: "手先ではなく腰のリードによってインパクトを迎えることで、押し込むパワーを最大化します。" },
            { label: "フェース面のコントロール", value: "完全スクエア維持", percentage: 80, description: "身体の回旋とクラブが調和し、インパクトゾーンにおけるフェースのブレが最小限になります。" }
          ],
          anatomyAndPhysics: `「${sensationText}」という感覚は、脳の運動前野が構築する神経回路の活性化を表します。末梢神経の余計な力みがシャットアウトされ、体幹深層部を主動作筋とした高効率なキネティックチェーンが成立します。`,
          focusScore: 88, actionAdvice: "この感覚が最もクリアに感じられた時のテンポを崩さないよう、プレショットルーティンに「この感覚を心で呟く」ことを組み込みましょう。"
        };
      };

      const handleAnalyze = async (e) => {
        e.preventDefault();
        if (!sensation.trim()) {
          showToast('自分の感覚を入力してください', 'error');
          return;
        }

        setIsAnalyzing(true);
        const clubsText = selectedClubs.join(', ');

        if (!apiKey.trim()) {

          setTimeout(() => {
            const fallbackData = getFallbackAnalysis(sensation, selectedClubs);
            const newResult = {
              id: 'carte-' + Date.now(),
              date: new Date().toLocaleDateString('ja-JP'),
              clubs: [...selectedClubs],
              sensation: sensation,
              ...fallbackData
            };
            setCurrentResult(newResult);
            setIsAnalyzing(false);
            showToast('感覚のトポロジー翻訳が完了しました！');
          }, 1200);
          return;
        }

        const systemPrompt = `
You are an elite, world-class golf biomechanics and motion analysis expert.
Translate a golfer's sensation into anatomical patterns.
Format strictly as a JSON object:
{
  "phase": "アドレス" | "テイクバック" | "トップ" | "ダウンスイング" | "インパクト" | "フォロースルー",
  "issue": "スライス防止" | "フック防止" | "飛距離アップ" | "打点の安定" | "方向性の改善" | "アプローチ改善",
  "translatedConcept": "Brief concept in Japanese (max 15 chars)",
  "checkpoints": [{"label": "string", "value": "string", "percentage": 0-100, "description": "string"}],
  "anatomyAndPhysics": "Max 200 chars in Japanese.",
  "focusScore": 0-100,
  "actionAdvice": "Physical cue trigger in Japanese."
}`;

        const userQuery = `主観的感覚: "${sensation}"\n選択された使用クラブ: ${clubsText}`;
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userQuery }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: { responseMimeType: "application/json" }
            })
          });
          if (response.ok) {
            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              const finalData = JSON.parse(text);
              setCurrentResult({
                id: 'carte-' + Date.now(), date: new Date().toLocaleDateString('ja-JP'),
                clubs: [...selectedClubs], sensation, ...finalData
              });
              setIsAnalyzing(false);
              showToast('Gemini API 翻訳が完了しました！');
              return;
            }
          }
        } catch (error) { console.error(error); }

        // Fallback
        const fallbackData = getFallbackAnalysis(sensation, selectedClubs);
        setCurrentResult({
          id: 'carte-' + Date.now(), date: new Date().toLocaleDateString('ja-JP'),
          clubs: [...selectedClubs], sensation, ...fallbackData
        });
        setIsAnalyzing(false);

          showToast('今日意識するポイントにピン留めしました！');

      };

        savePinsToStorage(pinnedIds.filter(pid => pid !== id));

                              card.phase.includes(searchQuery);
        const matchesClub = filterClub === 'ALL' || card.clubs.includes(filterClub);

                <Icons.Activity className="w-5 h-5 text-slate-950 stroke-[2.5]" />
              </div>
              <div>
                <h1 className="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-slate-100 to-emerald-400 bg-clip-text text-transparent">

            <div className="flex items-center gap-2">
              <button 
                onClick={() => setShowSettings(!showSettings)}
                className={`p-2 rounded-lg border transition-all flex items-center gap-1 ${

                }`}
              >
                <Icons.Settings className="w-4 h-4" />
                <span className="text-[10px] font-bold hidden sm:inline">{apiKey ? 'APIキー設定済' : 'API未設定'}</span>
              </button>

          {/* --- API設定モーダル --- */}

            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">

                  <div>
                    <h3 className="text-sm font-bold text-slate-200">Gemini APIキー設定</h3>

            {/* タブナビゲーション */}
            <div className="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-xl mb-6 border border-slate-800">
              <button onClick={() => setActiveTab('translator')} className={`flex flex-col items-center gap-1 py-2.5 rounded-lg text-xs font-semibold transition-all ${activeTab === 'translator' ? 'bg-gradient-to-r from-emerald-950 to-slate-900 text-emerald-400 border border-emerald-500/30' : 'text-slate-400'}`}>
                <Icons.Sparkles className="w-4 h-4" /><span>感覚を翻訳する</span>
              </button>
              <button onClick={() => setActiveTab('cards')} className={`flex flex-col items-center gap-1 py-2.5 rounded-lg text-xs font-semibold transition-all ${activeTab === 'cards' ? 'bg-gradient-to-r from-emerald-950 to-slate-900 text-emerald-400 border border-emerald-500/30' : 'text-slate-400'}`}>
                <Icons.BookOpen className="w-4 h-4" /><span>スイングカルテ ({cardList.length})</span>

            {/* --- TAB 1: TRANSLATOR (AI翻訳) --- */}
            {activeTab === 'translator' && (
              <div className="space-y-6">
                <div className="bg-slate-900 rounded-2xl p-5 border border-slate-800 shadow-xl relative overflow-hidden">
                  <h2 className="text-sm font-bold text-slate-300 flex items-center gap-2 mb-4">
                    <span className="w-1.5 h-3 bg-emerald-500 rounded-full"></span>感覚を言語化・物理指標へ翻訳
                  </h2>

                  <form onSubmit={handleAnalyze} className="space-y-5">
                    <div className="space-y-1.5">
                      <div className="flex justify-between items-center">
                        <label className="text-xs text-slate-300 font-bold">あなたの「うまくいく感覚」</label>
                        {sensation.length > 0 && (
                          <button type="button" onClick={() => setSensation('')} className="text-[10px] text-rose-400 font-bold flex items-center gap-0.5"><Icons.RotateCcw className="w-3 h-3" /><span>クリア</span></button>
                        )}
                      </div>
                      <textarea
                        value={sensation} onChange={(e) => setSensation(e.target.value)}
                        placeholder="例：右脇にタオルを挟んだまま引く感じ、トップでクラブの重さを感じる、手元をベルトの低さで通す... 複雑なフィーリングも自由に書き込めます。"
                        className="w-full bg-slate-950 text-slate-100 rounded-xl p-3 text-sm border border-slate-800 focus:border-emerald-500 outline-none h-32 resize-none" maxLength={1000}
                      />
                    </div>

                    <div className="space-y-2">
                      <div className="flex justify-between items-center">
                        <label className="text-xs text-slate-300 font-bold">対象クラブ（複数選択可）</label>
                        <button type="button" onClick={handleAllClubsToggle} className="text-[10px] text-emerald-400 font-extrabold">一括選択 / 解除</button>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        {CLUB_OPTIONS.map((club) => {
                          const isSelected = selectedClubs.includes(club);
                          return (
                            <button key={club} type="button" onClick={() => handleClubToggle(club)} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-all ${isSelected ? 'bg-emerald-950/60 text-emerald-400 border-emerald-500/40' : 'bg-slate-950 text-slate-400 border-slate-850'}`}>
                              {club}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <button type="submit" disabled={isAnalyzing} className="w-full bg-gradient-to-r from-emerald-500 to-emerald-400 text-slate-950 font-bold py-3.5 px-4 rounded-xl text-xs tracking-wider transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2 disabled:opacity-50">
                      {isAnalyzing ? <><span className="w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span><span>AI解析・シミュレーター構築中...</span></> : <><Icons.Sparkles className="w-4 h-4 fill-slate-950" /><span>感覚を自動翻訳する</span></>}
                    </button>
                  </form>
                </div>

                {/* --- 解析結果表示 --- */}
                {currentResult && !isAnalyzing && (
                  <div className="bg-slate-900 border-2 border-emerald-500/30 rounded-2xl p-5 shadow-2xl relative animate-in fade-in slide-in-from-bottom-4 duration-300">
                    <div className="absolute top-0 right-0 bg-emerald-500 text-slate-950 px-3 py-1 rounded-bl-xl text-[10px] font-extrabold uppercase">Analysis Complete</div>

                    <div className="mb-4">
                      <div className="flex flex-wrap items-center gap-1.5 mb-2.5">
                        {currentResult.clubs.map((c) => (<span key={c} className="bg-slate-950 text-slate-300 px-2 py-0.5 rounded text-[9px] font-bold border border-slate-800">{c}</span>))}
                        <span className="bg-emerald-950/50 text-emerald-300 px-2 py-0.5 rounded text-[9px] font-bold border border-emerald-500/20">タグ: {currentResult.issue}</span>
                      </div>
                      
                      <div className="flex items-start justify-between gap-4">
                        <h3 className="text-xl font-extrabold text-slate-100">{currentResult.translatedConcept}</h3>
                        <button onClick={() => copyTextToClipboard(formatCarteToText(currentResult))} className="p-2 rounded-lg bg-slate-950 text-emerald-400 border border-slate-800 hover:text-emerald-300 transition-all flex items-center gap-1 shrink-0"><Icons.Clipboard className="w-4 h-4" /><span className="text-[10px] font-bold hidden sm:inline">コピー</span></button>
                      </div>
                      <p className="text-xs text-slate-400 mt-2 bg-slate-950 p-2.5 rounded-lg border border-slate-850 italic">「{currentResult.sensation}」</p>
                    </div>

                    {/* --- 線人間（スケルトン）モジュールの組み込み --- */}
                    <SwingSkeleton result={currentResult} />

                    {/* スイングフェーズのタイムライン */}
                    <div className="mb-6">
                      <span className="text-[10px] uppercase tracking-wider text-slate-500 font-bold block mb-2">該当スイングフェーズ</span>
                      <div className="grid grid-cols-6 gap-1 relative">
                        {SWING_PHASES.map((ph) => {
                          const isActive = currentResult.phase === ph;
                          return (
                            <div key={ph} className="flex flex-col items-center">
                              <div className={`w-full h-1 rounded-full transition-all duration-300 ${isActive ? 'bg-gradient-to-r from-emerald-500 to-lime-400' : 'bg-slate-800'}`} />
                              <span className={`text-[9px] mt-1.5 font-bold ${isActive ? 'text-emerald-400' : 'text-slate-600'}`}>{ph}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* 物理的チェックポイント */}
                    <div className="space-y-4 mb-6">
                      <span className="text-[10px] uppercase tracking-wider text-slate-500 font-bold block">客観的な物理指標チェックポイント</span>
                      {currentResult.checkpoints.map((cp, idx) => (
                        <div key={idx} className="bg-slate-950/70 p-3 rounded-xl border border-slate-800/60">
                          <div className="flex justify-between items-start mb-1.5">
                            <div>
                              <h4 className="text-xs font-bold text-slate-200">{cp.label}</h4>
                              <p className="text-[11px] text-slate-400 mt-0.5 leading-normal">{cp.description}</p>
                            </div>
                            <span className="text-xs font-extrabold text-emerald-400 bg-emerald-950/30 px-2 py-0.5 rounded border border-emerald-500/20 whitespace-nowrap">{cp.value}</span>
                          </div>
                          <div className="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
                            <div className="h-full bg-gradient-to-r from-emerald-600 to-emerald-400 rounded-full" style={{ width: `${cp.percentage}%` }} />
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* 解剖学・運動連鎖の解説 */}
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-6">
                      <h4 className="text-xs font-bold text-slate-300 flex items-center gap-1.5 mb-2"><Icons.Info className="w-3.5 h-3.5 text-emerald-400" />バイオメカニクス ＆ スイング物理</h4>
                      <p className="text-xs text-slate-400 leading-relaxed">{currentResult.anatomyAndPhysics}</p>
                    </div>

                    {/* トリガー動作 */}
                    <div className="border-t border-slate-800 pt-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                      <div>
                        <span className="text-[10px] text-slate-500 font-bold block uppercase">再現トリガーアドバイス</span>
                        <p className="text-xs text-emerald-300 font-medium mt-0.5">{currentResult.actionAdvice}</p>
                      </div>
                      <div className="flex items-center gap-2 w-full md:w-auto">
                        <button onClick={() => togglePin(currentResult.id)} className={`flex-1 md:flex-none flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold border transition-all ${pinnedIds.includes(currentResult.id) ? 'bg-amber-500 text-slate-950 border-amber-600' : 'bg-slate-800 text-slate-300'}`}><Icons.Pin className="w-3.5 h-3.5" /><span>ピン留め</span></button>
                        <button onClick={saveToCardList} className="flex-1 md:flex-none flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl text-xs font-extrabold bg-emerald-500 text-slate-950 hover:bg-emerald-400 transition-all"><Icons.Plus className="w-4 h-4" /><span>カルテに保存</span></button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* --- TAB 2: SWING CARDS (カルテ一覧) --- */}
            {activeTab === 'cards' && (
              <div className="space-y-4 animate-in fade-in duration-200">
                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                  <div className="relative">
                    <Icons.Search className="absolute left-3 top-2.5 h-4 w-4 text-slate-500" />
                    <input type="text" placeholder="感覚、フェーズ、翻訳ワードで検索..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-slate-950 text-slate-100 rounded-lg pl-9 pr-4 py-2 text-xs border border-slate-800 outline-none h-9" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div className="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">
                      <span className="text-[10px] text-slate-500 font-bold">CLUB:</span>
                      <select value={filterClub} onChange={(e) => setFilterClub(e.target.value)} className="bg-transparent text-slate-300 text-[11px] outline-none w-full font-semibold">
                        <option value="ALL">すべて表示</option>
                        {CLUB_OPTIONS.map((club) => (<option key={club} value={club}>{club}</option>))}
                      </select>
                    </div>
                    <div className="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">
                      <span className="text-[10px] text-slate-500 font-bold">課題:</span>
                      <select value={filterIssue} onChange={(e) => setFilterIssue(e.target.value)} className="bg-transparent text-slate-300 text-[11px] outline-none w-full font-semibold">
                        <option value="ALL">すべて表示</option>
                        {['スライス防止', 'フック防止', '飛距離アップ', '打点の安定', '方向性の改善', 'アプローチ改善'].map(i => <option key={i} value={i}>{i}</option>)}
                      </select>
                    </div>
                  </div>
                </div>

                {filteredCards.length === 0 ? (
                  <div className="text-center py-12 bg-slate-900 rounded-2xl border border-slate-800">
                    <p className="text-xs text-slate-400">該当するスイングカルテが見つかりません。</p>
                  </div>
                ) : (
                  filteredCards.map((card) => {
                    const isPinned = pinnedIds.includes(card.id);
                    return (
                      <div key={card.id} className="bg-slate-900 rounded-xl border border-slate-800/80 p-4 relative hover:border-slate-700 transition-all">
                        <div className="flex justify-between items-start gap-2 mb-2.5">
                          <div className="flex flex-wrap items-center gap-1.5 max-w-[70%]">
                            {card.clubs.map((c) => (<span key={c} className="text-[9px] bg-slate-950 text-slate-300 px-2 py-0.5 rounded font-bold border border-slate-850">{c}</span>))}
                            <span className="text-[9px] bg-emerald-950/30 text-emerald-400 px-2 py-0.5 rounded font-bold border border-emerald-500/10">{card.issue}</span>
                            <span className="text-[9px] bg-slate-950 text-slate-500 px-2 py-0.5 rounded font-medium">{card.date}</span>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            <button onClick={() => copyTextToClipboard(formatCarteToText(card))} className="p-1.5 rounded-lg bg-slate-950 text-emerald-400 border border-slate-800"><Icons.Clipboard className="w-3.5 h-3.5" /></button>
                            <button onClick={() => togglePin(card.id)} className={`p-1.5 rounded-lg border ${isPinned ? 'bg-amber-950/40 text-amber-400 border-amber-500/30' : 'bg-slate-950 text-slate-500 border-slate-800'}`}><Icons.Pin className="w-3.5 h-3.5" /></button>
                            <button onClick={() => deleteCard(card.id)} className="p-1.5 rounded-lg bg-slate-950 text-slate-500 border border-slate-800 hover:text-rose-400"><Icons.Trash2 className="w-3.5 h-3.5" /></button>
                          </div>
                        </div>

                        <div className="mb-3">
                          <h4 className="text-sm font-extrabold text-slate-200 flex items-center gap-2 flex-wrap">
                            <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full"></span>{card.translatedConcept}
                            <span className="text-[10px] text-emerald-500 bg-emerald-950/40 px-1.5 py-0.2 rounded border border-emerald-500/10">{card.phase}</span>
                          </h4>
                          <p className="text-xs text-slate-400 mt-2 bg-slate-950 p-2.5 rounded-lg border border-slate-850 italic">「{card.sensation}」</p>
                        </div>

                        <details className="group">
                          <summary className="list-none flex items-center justify-between text-[11px] text-slate-400 font-bold cursor-pointer pt-1 select-none">
                            <span>ポーズシミュレーション・理論詳細</span>
                            <Icons.ChevronDown className="w-3.5 h-3.5 transition-transform group-open:rotate-180" />
                          </summary>
                          <div className="mt-3 pt-3 border-t border-slate-800 space-y-3">
                            
                            {/* 履歴内でも骨格を描画 */}
                            <SwingSkeleton result={card} />

                            <div className="grid grid-cols-1 gap-2">
                              {card.checkpoints.map((cp, idx) => (
                                <div key={idx} className="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800/60 flex justify-between items-center text-xs">
                                  <div><span className="font-bold text-slate-200 block">{cp.label}</span><span className="text-[10px] text-slate-400">{cp.description}</span></div>
                                  <span className="text-[11px] font-bold text-emerald-400 whitespace-nowrap">{cp.value}</span>
                                </div>
                              ))}
                            </div>
                            <div className="bg-slate-950/60 p-3 rounded-lg border border-slate-800 text-[11px] text-slate-400">{card.anatomyAndPhysics}</div>
                            <div className="bg-emerald-950/10 p-2.5 rounded-lg border border-emerald-500/10 text-[11px]"><strong className="text-emerald-400 block font-bold">再現アドバイス:</strong><span className="text-slate-300">{card.actionAdvice}</span></div>
                          </div>
                        </details>
                      </div>
                    );
                  })
                )}
              </div>
            )}

            {/* --- TAB 3: TODAY'S PIN (今日のピン留め) --- */}
            {activeTab === 'today' && (
              <div className="space-y-4 animate-in fade-in duration-200">
                <div className="bg-gradient-to-r from-emerald-950 to-slate-900 border border-emerald-500/20 rounded-2xl p-4 shadow-xl">
                  <h3 className="text-sm font-bold text-emerald-400 flex items-center gap-2 mb-1.5"><Icons.Target className="w-4 h-4 text-emerald-400" />練習場 & ラウンド用 ミニマリストモード</h3>
                  <p className="text-xs text-slate-300">重要な感覚を**最大3つ**だけ厳選し、現場でのスケルトントポロジーとトリガー動作を瞬時に反芻します。</p>
                </div>

                {pinnedIds.length === 0 ? (
                  <div className="text-center py-16 bg-slate-900 rounded-2xl border border-slate-800">
                    <p className="text-xs text-slate-400 mb-4">今日意識する感覚がピン留めされていません。</p>
                    <button onClick={() => { setActiveTab('cards'); }} className="bg-emerald-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">カルテを選ぶ</button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {cardList.filter(card => pinnedIds.includes(card.id)).map((card) => {
                      const isChecked = checkedPins[card.id] || false;
                      return (
                        <div key={card.id} className={`border rounded-xl p-4 transition-all ${isChecked ? 'bg-slate-950/60 opacity-60 line-through' : 'bg-slate-900 border-slate-800 shadow-md'}`}>
                          <div className="flex items-start justify-between gap-3">
                            <div className="flex items-start gap-2.5">
                              <button onClick={() => setCheckedPins({...checkedPins, [card.id]: !isChecked})} className={`mt-1 flex items-center justify-center w-5 h-5 rounded-full border ${isChecked ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600'}`}><Icons.Check className="w-3.5 h-3.5 stroke-[3]" /></button>
                              <div>
                                <div className="flex flex-wrap items-center gap-1.5">
                                  {card.clubs.map((c) => (<span key={c} className="text-[9px] bg-slate-950 text-slate-400 px-1.5 py-0.5 rounded font-bold">{c}</span>))}
                                  <span className="text-[10px] text-emerald-400 font-extrabold">{card.translatedConcept}</span>
                                  <span className="text-[9px] text-slate-500">({card.phase})</span>
                                </div>
                                <p className="text-sm font-medium text-slate-100 mt-2.5">「{card.sensation}」</p>
                                
                                {!isChecked && (
                                  <>
                                    <SwingSkeleton result={card} />
                                    <div className="mt-2 text-xs text-emerald-300 bg-slate-950/40 p-2 rounded border border-slate-850"><strong>再現トリガー:</strong> {card.actionAdvice}</div>
                                  </>
                                )}
                              </div>
                            </div>
                            <button onClick={() => togglePin(card.id)} className="text-slate-500 hover:text-rose-400"><Icons.X className="w-4 h-4" /></button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* --- トースト通知 --- */}
          {toast && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-slate-800 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2">
              <Icons.CheckCircle2 className="w-4 h-4 text-emerald-400" />
              <span className="text-xs font-semibold">{toast.message}</span>
            </div>
          )}

          {/* --- フッターナビゲーション (モバイル用) --- */}
          <footer className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 border-t border-slate-800 py-3 px-6 flex justify-around items-center backdrop-blur-md">
            <button onClick={() => { setActiveTab('translator'); window.scrollTo(0, 0); }} className={`flex flex-col items-center gap-1 ${activeTab === 'translator' ? 'text-emerald-400' : 'text-slate-500'}`}><Icons.Sparkles className="w-5 h-5" /><span className="text-[10px] font-bold">AI翻訳</span></button>
            <button onClick={() => { setActiveTab('cards'); window.scrollTo(0, 0); }} className={`flex flex-col items-center gap-1 ${activeTab === 'cards' ? 'text-emerald-400' : 'text-slate-500'}`}><Icons.BookOpen className="w-5 h-5" /><span className="text-[10px] font-bold">カルテ</span></button>
            <button onClick={() => { setActiveTab('today'); window.scrollTo(0, 0); }} className={`flex flex-col items-center gap-1 ${activeTab === 'today' ? 'text-emerald-400' : 'text-slate-500'}`}><Icons.Target className="w-5 h-5" /><span className="text-[10px] font-bold">ピン留め</span></button>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
