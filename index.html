    // --- 超進化：Three.js 3Dインタラクティブ線人間エンジン ---
    function SwingSkeleton3D({ phase, showPlane = true }) {
      const containerRef = useRef(null);
      const [currentAngle, setCurrentAngle] = useState('down-the-line');
      const [isPlaying, setIsPlaying] = useState(false);
      const [timelinePercent, setTimelinePercent] = useState(0);

      // アニメーションおよびThree.jsインスタンスの参照保持
      const threeRef = useRef({
        scene: null, camera: null, renderer: null, controls: null,
        skeletonGroup: null, planeMesh: null,
        bones: {}
      });

      // スイングの各基準点となる骨格ポーズ（x, y, z）のシミュレートデータ
      // 三次元空間（X: 左右/飛球線方向, Y: 上下, Z: 奥行き）
      const POSE_KEYFRAMES = {
        'アドレス': {
          hip: [0, 1.0, 0],
          spine: [0.1, 1.35, -0.15],
          neck: [0.2, 1.6, -0.2],
          head: [0.22, 1.75, -0.21],
          leftShoulder: [0.15, 1.55, -0.1],
          rightShoulder: [0.25, 1.53, -0.3],
          hand: [0.4, 1.1, -0.15],
          clubHead: [0.9, 0.05, -0.15],
          leftKnee: [0.15, 0.5, -0.05],
          leftFoot: [0.15, 0, 0.2],
          rightKnee: [0.15, 0.5, -0.25],
          rightFoot: [0.15, 0, -0.2]
        },
        'テイクバック': {
          hip: [-0.02, 1.0, -0.02],
          spine: [0.05, 1.35, -0.12],
          neck: [0.12, 1.6, -0.18],
          head: [0.15, 1.75, -0.2],
          leftShoulder: [0.05, 1.55, -0.05],
          rightShoulder: [0.18, 1.53, -0.35],
          hand: [0.2, 1.25, -0.35],
          clubHead: [-0.5, 1.2, -0.4],
          leftKnee: [0.12, 0.5, -0.08],
          leftFoot: [0.15, 0, 0.2],
          rightKnee: [0.15, 0.5, -0.25],
          rightFoot: [0.15, 0, -0.2]
        },
        'トップ': {
          hip: [-0.05, 1.0, -0.05],
          spine: [0.0, 1.35, -0.1],
          neck: [0.08, 1.6, -0.15],
          head: [0.12, 1.75, -0.18],
          leftShoulder: [-0.1, 1.58, -0.05],
          rightShoulder: [0.15, 1.5, -0.35],
          hand: [-0.15, 1.75, -0.4],
          clubHead: [0.6, 1.8, -0.2], // シャフトがクロス気味に水平
          leftKnee: [0.05, 0.5, -0.12], // 左足が内側へ送り込まれる
          leftFoot: [0.15, 0, 0.2],
          rightKnee: [0.15, 0.5, -0.25],
          rightFoot: [0.15, 0, -0.2]
        },
        'ダウンスイング': {
          hip: [0.02, 0.96, 0.0], // やや沈み込み
          spine: [0.12, 1.31, -0.12],
          neck: [0.22, 1.56, -0.18],
          head: [0.25, 1.71, -0.2],
          leftShoulder: [0.12, 1.51, -0.08],
          rightShoulder: [0.28, 1.49, -0.28],
          hand: [0.25, 1.15, -0.25], // 体の近くに引き下ろされる
          clubHead: [-0.2, 1.4, -0.3], // 強烈なタメ(ラグ)
          leftKnee: [0.18, 0.48, -0.02],
          leftFoot: [0.15, 0, 0.2],
          rightKnee: [0.15, 0.48, -0.25],
          rightFoot: [0.15, 0, -0.2]
        },
        'インパクト': {
          hip: [0.1, 0.98, 0.05], // 腰がターゲット方向へ回転＆開く
          spine: [0.22, 1.34, -0.1],
          neck: [0.3, 1.59, -0.16],
          head: [0.28, 1.74, -0.18], // ビハインド・ザ・ボール
          leftShoulder: [0.25, 1.54, -0.05],
          rightShoulder: [0.35, 1.51, -0.25],
          hand: [0.42, 1.08, -0.1], // ハンドファースト
          clubHead: [0.9, 0.05, -0.15], // スクエアにボールを捕える
          leftKnee: [0.22, 0.52, 0.02], // 左壁の形成
          leftFoot: [0.15, 0, 0.2],
          rightKnee: [0.15, 0.5, -0.25],
          rightFoot: [0.15, 0, -0.2]
        },
        'フォロースルー': {
          hip: [0.25, 1.02, 0.15],
          spine: [0.32, 1.38, -0.02],
          neck: [0.35, 1.63, -0.05],
          head: [0.32, 1.78, -0.07],
          leftShoulder: [0.35, 1.58, 0.05],
          rightShoulder: [0.25, 1.56, -0.2],
          hand: [0.65, 1.6, 0.1], // 高いフォロースルー
          clubHead: [-0.1, 1.75, 0.15], // 体に巻き付くシャフト
          leftKnee: [0.25, 0.52, 0.1],
          leftFoot: [0.15, 0, 0.2],
          rightKnee: [0.22, 0.5, -0.15], // 右膝の送り込み
          rightFoot: [0.15, 0.02, -0.18] // 右足かかとが上がる
        }
      };

      // ２点間のフレーム補間(Lerp)ヘルパー
      const lerpVal = (start, end, amt) => (1 - amt) * start + amt * end;
      const interpolatePose = (poseA, poseB, ratio) => {
        const result = {};
        Object.keys(poseA).forEach(joint => {
          result[joint] = [
            lerpVal(poseA[joint][0], poseB[joint][0], ratio),
            lerpVal(poseA[joint][1], poseB[joint][1], ratio),
            lerpVal(poseA[joint][2], poseB[joint][2], ratio)
          ];
        });
        return result;
      };

      // タイムラインパーセンテージ(0-100)から3Dポーズを算出
      const getPoseAtPercentage = (percent) => {
        const keys = ['アドレス', 'テイクバック', 'トップ', 'ダウンスイング', 'インパクト', 'フォロースルー'];
        const totalSegments = keys.length - 1;
        const exactIndex = (percent / 100) * totalSegments;
        const lowerIndex = Math.floor(exactIndex);
        const upperIndex = Math.ceil(exactIndex);
        const ratio = exactIndex - lowerIndex;

        return interpolatePose(
          POSE_KEYFRAMES[keys[lowerIndex]],
          POSE_KEYFRAMES[keys[upperIndex]],
          ratio
        );
      };

      // 視点（プリセットアングル）の切り替え
      const handleAngleChange = (angle) => {
        setCurrentAngle(angle);
        const camera = threeRef.current.camera;
        const controls = threeRef.current.controls;
        if (!camera || !controls) return;

        // X: ターゲット方向（＋が飛球線前方、ーが飛球線後方）
        // Y: 高度
        // Z: 奥行き（＋が正面、ーが背中側）
        if (angle === 'down-the-line') { // 後方から
          camera.position.set(-2.5, 1.3, 0); 
        } else if (angle === 'face-on') { // 正面から
          camera.position.set(0.4, 1.2, 2.5);
        } else if (angle === 'bird-eye') { // 上空から
          camera.position.set(0.3, 3.2, 0.01);
        }
        controls.target.set(0.3, 1.0, -0.1);
        controls.update();
      };

      // スイングフェーズが外部Reactステートから切り替わったときにタイムラインへ同期
      useEffect(() => {
        if (!isPlaying) {
          const keys = ['アドレス', 'テイクバック', 'トップ', 'ダウンスイング', 'インパクト', 'フォロースルー'];
          const matchedIdx = keys.indexOf(phase);
          if (matchedIdx !== -1) {
            setTimelinePercent((matchedIdx / (keys.length - 1)) * 100);
          }
        }
      }, [phase]);

      // スイングオートプレイアニメーションループ
      useEffect(() => {
        let animId;
        if (isPlaying) {
          const startTime = Date.now();
          const tick = () => {
            const elapsed = Date.now() - startTime;
            const duration = 2400; // スイング一周 2.4秒
            const progress = (elapsed % duration) / duration;
            setTimelinePercent(progress * 100);
            animId = requestAnimationFrame(tick);
          };
          animId = requestAnimationFrame(tick);
        }
        return () => cancelAnimationFrame(animId);
      }, [isPlaying]);

      // Three.js シーンのセットアップとライフサイクル管理
      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        // 1. シーン定義
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#070d19');

        // 2. カメラ初期配置
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(-2.4, 1.3, 0); // 初期値：後方視点(Down the Line)

        // 3. WebGL レンダラーの作成
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 4. マウス操作用の OrbitControls をアタッチ
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // 地面以下への潜り込み防止
        controls.minDistance = 1.0;
        controls.maxDistance = 5.0;
        controls.target.set(0.3, 1.0, -0.1);
        controls.update();

        // 5. 光源配置（SF的マトリックス感のあるアンビエント＆ディレクション光）
        const ambientLight = new THREE.AmbientLight('#ffffff', 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight('#38bdf8', 1.0); // サイアン系ライト
        dirLight.position.set(2, 4, 3);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight('#10b981', 1.0, 5); // エメラルド系環境光源
        pointLight.position.set(0, 1.5, 0);
        scene.add(pointLight);

        // 6. 3D空間のアライメント目安
        // 地面のサークルグリッド
        const gridHelper = new THREE.GridHelper(6, 30, '#1e293b', '#0f172a');
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // 基準となるスイングプレーン（3D赤いグリッド平面）のモデリング
        // 145度前後のプレーン再現を表現した傾いたサークル
        const planeGroup = new THREE.Group();
        const planeGeo = new THREE.RingGeometry(0.3, 1.3, 32);
        const planeMat = new THREE.MeshBasicMaterial({ 
          color: '#ef4444', 
          side: THREE.DoubleSide, 
          transparent: true, 
          opacity: 0.08,
          wireframe: true
        });
        const planeMesh = new THREE.Mesh(planeGeo, planeMat);
        planeMesh.rotation.x = Math.PI / 3; // スイング傾斜角(約60度)
        planeMesh.rotation.y = 0.15;
        planeMesh.position.set(0.4, 0.9, -0.15);
        planeGroup.add(planeMesh);
        scene.add(planeGroup);

        // ボールマーク（3D）
        const ballGeo = new THREE.SphereGeometry(0.025, 16, 16);
        const ballMat = new THREE.MeshBasicMaterial({ color: '#ffffff' });
        const ballMesh = new THREE.Mesh(ballGeo, ballMat);
        ballMesh.position.set(0.9, 0.025, -0.15); // ボールの3D座標
        scene.add(ballMesh);

        // 7. スケルトン（ボーン・線人間）を構成する3Dメッシュマテリアルの用意
        const skeletonGroup = new THREE.Group();
        scene.add(skeletonGroup);

        const jointGeo = new THREE.SphereGeometry(0.035, 16, 16);
        const headGeo = new THREE.SphereGeometry(0.08, 24, 24);
        
        const coreMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.1, metalness: 0.8 }); // 脊椎・頭用
        const leftLimbMat = new THREE.MeshStandardMaterial({ color: '#10b981', roughness: 0.1 }); // 左半身(エメラルド)
        const rightLimbMat = new THREE.MeshStandardMaterial({ color: '#334155', roughness: 0.5 }); // 右半身(スレート)
        const armMat = new THREE.MeshStandardMaterial({ color: '#38bdf8' }); // 腕（スカイブルー）
        const shaftMat = new THREE.MeshStandardMaterial({ color: '#fbbf24', roughness: 0.1 }); // シャフト（ゴールド）
        const clubHeadMat = new THREE.MeshStandardMaterial({ color: '#ef4444' }); // クラブヘッド

        // 3Dシーンへの描画管理（シーン内のメッシュ更新関数群）
        const updateSkeleton3D = (pose) => {
          // すでに描画されていた線人間をクリーンアップ
          while (skeletonGroup.children.length > 0) {
            skeletonGroup.remove(skeletonGroup.children[0]);
          }

          const joints = {};

          // 各関節（Joint）を球体として配置
          Object.keys(pose).forEach(jName => {
            const pos = pose[jName];
            const isLeft = jName.toLowerCase().includes('left');
            const isRight = jName.toLowerCase().includes('right');
            const isArm = jName.toLowerCase().includes('hand') || jName.toLowerCase().includes('shoulder');
            const isClub = jName.toLowerCase().includes('club');

            let mat = coreMat;
            if (isLeft) mat = leftLimbMat;
            else if (isRight) mat = rightLimbMat;
            else if (isArm) mat = armMat;
            else if (isClub) mat = clubHeadMat;

            const geo = jName === 'head' ? headGeo : jointGeo;
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(pos[0], pos[1], pos[2]);
            skeletonGroup.add(mesh);
            joints[jName] = mesh.position;
          });

          // ボーン（関節どうしを結ぶ3Dシリンダー線）を描画するヘルパー
          const drawBone = (p1, p2, colorHex, thick = 0.02) => {
            if (!p1 || !p2) return;
            const distance = p1.distanceTo(p2);
            const cylGeo = new THREE.CylinderGeometry(thick, thick, distance, 8);
            const cylMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.2 });
            const cyl = new THREE.Mesh(cylGeo, cylMat);

            // シリンダーの向きと回転を中心座標に基づいてアライメント
            const midPoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            cyl.position.copy(midPoint);

            const direction = new THREE.Vector3().subVectors(p2, p1).normalize();
            const up = new THREE.Vector3(0, 1, 0);
            cyl.quaternion.setFromUnitVectors(up, direction);

            skeletonGroup.add(cyl);
          };

          // 人体トポロジーに沿って関節間を太い骨格シリンダーで結ぶ
          // 骨盤 -> 脊椎 -> 首 -> 頭
          drawBone(joints.hip, joints.spine, '#f8fafc', 0.035);
          drawBone(joints.spine, joints.neck, '#f8fafc', 0.035);
          drawBone(joints.neck, joints.head, '#f8fafc', 0.03);

          // 肩周りのアライメント
          drawBone(joints.neck, joints.leftShoulder, '#10b981', 0.025);
          drawBone(joints.neck, joints.rightShoulder, '#334155', 0.025);

          // 腕
          drawBone(joints.leftShoulder, joints.hand, '#38bdf8', 0.02);
          drawBone(joints.rightShoulder, joints.hand, '#38bdf8', 0.015);

          // 下半身 (左足)
          drawBone(joints.hip, joints.leftKnee, '#059669', 0.03);
          drawBone(joints.leftKnee, joints.leftFoot, '#059669', 0.025);

          // 下半身 (右足)
          drawBone(joints.hip, joints.rightKnee, '#1e293b', 0.03);
          drawBone(joints.rightKnee, joints.rightFoot, '#1e293b', 0.025);

          // クラブシャフト & クラブヘッド
          drawBone(joints.hand, joints.clubHead, '#fbbf24', 0.015);
        };

        // レンダリングループの登録
        let animFrameId;
        const animate = () => {
          controls.update();
          renderer.render(scene, camera);
          animFrameId = requestAnimationFrame(animate);
        };
        animate();

        // 参照データの保存
        threeRef.current = {
          scene, camera, renderer, controls,
          skeletonGroup, planeMesh, updateSkeleton3D
        };

        // レスポンシブなウィンドウリサイズハンドリング
        const handleResize = () => {
          if (!containerRef.current) return;
          const w = containerRef.current.clientWidth;
          const h = containerRef.current.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        // ライフサイクル終了時の3Dアセット破棄処理
        return () => {
          cancelAnimationFrame(animFrameId);
          window.removeEventListener('resize', handleResize);
          if (container && renderer.domElement) {
            container.removeChild(renderer.domElement);
          }
          renderer.dispose();
        };
      }, []);

      // タイムラインパーセンテージが変更されるごとに3D線人間をアップデート
      useEffect(() => {
        if (threeRef.current.updateSkeleton3D) {
          const currentPose = getPoseAtPercentage(timelinePercent);
          threeRef.current.updateSkeleton3D(currentPose);
        }
      }, [timelinePercent]);

      // ガイドプレーン表示/非表示の変更検知
      useEffect(() => {
        if (threeRef.current.planeMesh) {
          threeRef.current.planeMesh.visible = showPlane;
        }
      }, [showPlane]);

      return (
        <div className="flex flex-col items-center bg-slate-900 p-4 rounded-2xl border border-slate-850 my-4 shadow-xl">
          
          {/* コントロールヘッダー */}
          <div className="w-full flex flex-wrap justify-between items-center gap-2 mb-3 px-1">
            <span className="text-[10px] text-emerald-400 font-extrabold uppercase tracking-wider flex items-center gap-1">
              <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
              感覚の3Dトポロジー・シミュレーター
            </span>
            
            {/* 3Dアングル切り替えプリセットボタン */}
            <div className="flex gap-1">
              <button 
                onClick={() => handleAngleChange('down-the-line')} 
                className={`px-2.5 py-1 rounded text-[9px] font-bold transition-all ${currentAngle === 'down-the-line' ? 'bg-emerald-500 text-slate-950 font-black' : 'bg-slate-950 text-slate-400'}`}
              >
                後方
              </button>
              <button 
                onClick={() => handleAngleChange('face-on')} 
                className={`px-2.5 py-1 rounded text-[9px] font-bold transition-all ${currentAngle === 'face-on' ? 'bg-emerald-500 text-slate-950 font-black' : 'bg-slate-950 text-slate-400'}`}
              >
                正面
              </button>
              <button 
                onClick={() => handleAngleChange('bird-eye')} 
                className={`px-2.5 py-1 rounded text-[9px] font-bold transition-all ${currentAngle === 'bird-eye' ? 'bg-emerald-500 text-slate-950 font-black' : 'bg-slate-950 text-slate-400'}`}
              >
                上空
              </button>
            </div>
          </div>

          {/* Three.js 描画コンテナ */}
          <div className="relative w-full h-[280px] rounded-xl overflow-hidden border border-slate-950">
            <div ref={containerRef} className="w-full h-full" />
            
            {/* マウス/ドラッグ ガイドメッセージ */}
            <div className="absolute top-2 left-2 text-[8px] bg-slate-950/80 text-slate-400 px-2 py-1 rounded border border-slate-800">
              🖱 ドラッグ/スワイプ: 3D回転 | スクロール: ズーム
            </div>
          </div>

          {/* 3Dスイングアニメーションプレーヤーコントロール */}
          <div className="w-full mt-4 space-y-3 bg-slate-950/60 p-3 rounded-xl border border-slate-850">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={() => setIsPlaying(!isPlaying)}
                  className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold p-2 rounded-lg text-xs transition-all flex items-center justify-center"
                  title={isPlaying ? "一時停止" : "自動スイング再生"}
                >
                  {isPlaying ? (
                    <span className="w-3.5 h-3.5 flex items-center justify-center gap-0.5">
                      <span className="w-1 h-3.5 bg-slate-950 rounded"></span>

                    </span>

                    <span className="w-3.5 h-3.5 flex items-center justify-center ml-0.5">
                      <svg className="w-3.5 h-3.5 fill-slate-950" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                      </svg>
                    </span>

                </button>
                <span className="text-[10px] text-slate-300 font-bold">
                  {isPlaying ? 'スイング再生中' : 'スイング位置調整'}
                </span>
              </div>
              <span className="text-[10px] text-slate-400 font-bold font-mono">
                {Math.round(timelinePercent)}%
              </span>
            </div>

            {/* 進捗スライダー */}
            <input
              type="range"
              min="0"
              max="100"
              value={Math.round(timelinePercent)}
              onChange={(e) => {
                setIsPlaying(false);
                setTimelinePercent(Number(e.target.value));

            />

            {/* スイングのフェーズ連動目盛り表示 */}

              <span>トップ</span>
              <span>ダウン</span>
              <span>インパクト</span>

            </div>
          </div>
        </div>
      );
    }

        if (text.includes("手元") || text.includes("低く") || text.includes("下ろす") || text.includes("引き下ろす") || text.includes("ゴミ")) {
          return {
            phase: "ダウンスイング", issue: detectedIssue, translatedConcept: "インサイドシャロー",

              { label: "グリップエンドの軌道", value: "真下へ直線的", percentage: 94, description: "手元を体の近く、かつ低い位置に引き下ろすことで、アウトサイドインのカット軌道を完全に抑え込みます。" },

            anatomyAndPhysics: "手元を低く下ろす意識は、遠心力に対抗する『向心力』を高めます。解剖学的には『広背筋』と『大円筋』の強力な収縮により、手元を身体の重心近くに通すことで、物理的な回転慣性モーメントを減少させます。",
            focusScore: 92, actionAdvice: "トップからグリップエンドで右足の太ももを突くような方向へ、直線的に引き下ろす感覚を試してください。"

You are an elite, world-class golf biomechanics and motion analysis expert.
Your mission is to translate a golfer's highly subjective and abstract "sensation" into objective, scientific, physics-based, and anatomical movement patterns.

Format your response strictly as a JSON object with this structure:
{
  "phase": "アドレス" | "テイクバック" | "トップ" | "ダウンスイング" | "インパクト" | "フォロースルー",
  "issue": "スライス防止" | "フック防止" | "飛距離アップ" | "打点の安定" | "方向性の改善" | "アプローチ改善",

  "checkpoints": [

      "percentage": 0 to 100,
      "description": "Specific detail of what to check in Japanese"

  "anatomyAndPhysics": "Explain the biological, anatomical, and physical mechanisms behind why this subjective feeling produces a good shot. Max 200 Japanese characters.",
  "focusScore": 0 to 100,
  "actionAdvice": "A simple actionable physical cue or trigger for the golfer to reproduce this on the range in Japanese."
}

Notes:
- The "checkpoints" array must have EXACTLY 3 items.
- Output ONLY the raw JSON structure, without any markdown formatting wrappers.
`;

        const userQuery = `主観的感覚: "${sensation}"\n選択された使用クラブ: ${clubsText}`;

            headers: { 'Content-Type': 'application/json' },

                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-6">
                      <h4 className="text-xs font-bold text-slate-300 flex items-center gap-1.5 mb-2"><Icons.Info className="w-3.5 h-3.5 text-emerald-400" />バイオメカニクス ＆ スイング物理</h4>
                      <p className="text-xs text-slate-400 leading-relaxed">{currentResult.anatomyAndPhysics}</p>
                    </div>

                    {/* トリガー動作 */}
                    <div className="border-t border-slate-800 pt-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                      <div>
                        <span className="text-[10px] text-slate-500 font-bold block uppercase">再現トリガーアドバイス</span>
                        <p className="text-xs text-emerald-300 font-medium mt-0.5">{currentResult.actionAdvice}</p>
                      </div>
                      <div className="flex items-center gap-2 w-full md:w-auto">
                        <button onClick={() => togglePin(currentResult.id)} className={`flex-1 md:flex-none flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold border transition-all ${pinnedIds.includes(currentResult.id) ? 'bg-amber-500 text-slate-950 border-amber-600' : 'bg-slate-800 text-slate-300'}`}><Icons.Pin className="w-3.5 h-3.5" /><span>ピン留め</span></button>
                        <button onClick={saveToCardList} className="flex-1 md:flex-none flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl text-xs font-extrabold bg-emerald-500 text-slate-950 hover:bg-emerald-400 transition-all"><Icons.Plus className="w-4 h-4" /><span>カルテに保存</span></button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* --- TAB 2: SWING CARDS (カルテ一覧) --- */}
            {activeTab === 'cards' && (
              <div className="space-y-4 animate-in fade-in duration-200">
                {/* フィルター＆検索 */}
                <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                  <div className="relative">
                    <Icons.Search className="absolute left-3 top-2.5 h-4 w-4 text-slate-500" />
                    <input type="text" placeholder="感覚、フェーズ、翻訳ワードで検索..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full bg-slate-950 text-slate-100 rounded-lg pl-9 pr-4 py-2 text-xs border border-slate-800 outline-none h-9 focus:border-emerald-500" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div className="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">
                      <span className="text-[10px] text-slate-500 font-bold">CLUB:</span>
                      <select value={filterClub} onChange={(e) => setFilterClub(e.target.value)} className="bg-transparent text-slate-300 text-[11px] outline-none w-full font-semibold">
                        <option value="ALL">すべて表示</option>
                        {CLUB_OPTIONS.map((club) => (<option key={club} value={club}>{club}</option>))}
                      </select>
                    </div>
                    <div className="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800">
                      <span className="text-[10px] text-slate-500 font-bold">課題:</span>
                      <select value={filterIssue} onChange={(e) => setFilterIssue(e.target.value)} className="bg-transparent text-slate-300 text-[11px] outline-none w-full font-semibold">
                        <option value="ALL">すべて表示</option>
                        {['スライス防止', 'フック防止', '飛距離アップ', '打点の安定', '方向性の改善', 'アプローチ改善'].map(i => <option key={i} value={i}>{i}</option>)}
                      </select>
                    </div>
                  </div>
                </div>

                {filteredCards.length === 0 ? (
                  <div className="text-center py-12 bg-slate-900 rounded-2xl border border-slate-800">
                    <p className="text-xs text-slate-400">該当するスイングカルテが見つかりません。</p>
                  </div>
                ) : (
                  filteredCards.map((card) => {
                    const isPinned = pinnedIds.includes(card.id);
                    return (
                      <div key={card.id} className="bg-slate-900 rounded-xl border border-slate-800/80 p-4 relative hover:border-slate-700 transition-all">
                        <div className="flex justify-between items-start gap-2 mb-2.5">
                          <div className="flex flex-wrap items-center gap-1.5 max-w-[70%]">
                            {card.clubs.map((c) => (<span key={c} className="text-[9px] bg-slate-950 text-slate-300 px-2 py-0.5 rounded font-bold border border-slate-850">{c}</span>))}
                            <span className="text-[9px] bg-emerald-950/30 text-emerald-400 px-2 py-0.5 rounded font-bold border border-emerald-500/10">{card.issue}</span>
                            <span className="text-[9px] bg-slate-950 text-slate-500 px-2 py-0.5 rounded font-medium">{card.date}</span>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            <button onClick={() => copyTextToClipboard(formatCarteToText(card))} className="p-1.5 rounded-lg bg-slate-950 text-emerald-400 border border-slate-800 hover:border-emerald-500/35 transition-all"><Icons.Clipboard className="w-3.5 h-3.5" /></button>
                            <button onClick={() => togglePin(card.id)} className={`p-1.5 rounded-lg border ${isPinned ? 'bg-amber-950/40 text-amber-400 border-amber-500/30' : 'bg-slate-950 text-slate-500 border-slate-800'}`}><Icons.Pin className="w-3.5 h-3.5" /></button>
                            <button onClick={() => deleteCard(card.id)} className="p-1.5 rounded-lg bg-slate-950 text-slate-500 border border-slate-800 hover:text-rose-400 hover:border-rose-500/20 transition-all"><Icons.Trash2 className="w-3.5 h-3.5" /></button>
                          </div>
                        </div>

                        <div className="mb-3">
                          <h4 className="text-sm font-extrabold text-slate-200 flex items-center gap-2 flex-wrap">
                            <span className="w-1.5 h-1.5 bg-emerald-400 rounded-full"></span>{card.translatedConcept}
                            <span className="text-[10px] text-emerald-500 bg-emerald-950/40 px-1.5 py-0.2 rounded border border-emerald-500/10">{card.phase}</span>
                          </h4>
                          <p className="text-xs text-slate-400 mt-2 bg-slate-950 p-2.5 rounded-lg border border-slate-850 italic whitespace-pre-wrap">「{card.sensation}」</p>
                        </div>

                        {/* 詳細アコーディオン */}
                        <details className="group">
                          <summary className="list-none flex items-center justify-between text-[11px] text-slate-400 font-bold cursor-pointer pt-1 select-none hover:text-slate-200 transition-colors">
                            <span>ポーズシミュレーション・理論詳細</span>
                            <Icons.ChevronDown className="w-3.5 h-3.5 transition-transform group-open:rotate-180 text-slate-500" />
                          </summary>
                          
                          <div className="mt-3 pt-3 border-t border-slate-800 space-y-3 animate-in fade-in duration-200">
                            
                            {/* 履歴カード内でも3Dスケルトンを連動描画 */}
                            <SwingSkeleton3D phase={card.phase} showPlane={showPlaneGlobal} />

                            <div className="grid grid-cols-1 gap-2">
                              {card.checkpoints.map((cp, idx) => (
                                <div key={idx} className="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800/60 flex justify-between items-center text-xs">
                                  <div><span className="font-bold text-slate-200 block">{cp.label}</span><span className="text-[10px] text-slate-400">{cp.description}</span></div>
                                  <span className="text-[11px] font-bold text-emerald-400 whitespace-nowrap">{cp.value}</span>
                                </div>
                              ))}
                            </div>
                            <div className="bg-slate-950/60 p-3 rounded-lg border border-slate-800 text-[11px] text-slate-400 leading-relaxed"><strong className="text-slate-300 block mb-1">【バイオメカニクス・物理解説】</strong>{card.anatomyAndPhysics}</div>
                            <div className="bg-emerald-950/10 p-2.5 rounded-lg border border-emerald-500/10 text-[11px]"><strong className="text-emerald-400 block font-bold">再現アドバイス:</strong><span className="text-slate-300">{card.actionAdvice}</span></div>
                          </div>
                        </details>
                      </div>
                    );
                  })
                )}
              </div>
            )}

            {/* --- TAB 3: TODAY'S PIN (今日のピン留め) --- */}
            {activeTab === 'today' && (
              <div className="space-y-4 animate-in fade-in duration-200">
                <div className="bg-gradient-to-r from-emerald-950 to-slate-900 border border-emerald-500/20 rounded-2xl p-4 shadow-xl">
                  <h3 className="text-sm font-bold text-emerald-400 flex items-center gap-2 mb-1.5"><Icons.Target className="w-4 h-4 text-emerald-400 animate-pulse" />練習場 & ラウンド用 ミニマリストモード</h3>
                  <p className="text-xs text-slate-300 leading-relaxed">再現に最も重要な感覚を**最大3つ**だけ厳選。現場で脳内イメージ（3D骨格）と筋肉の動作トリガーを反芻し、無駄な雑念を完全にシャットアウトします。</p>
                </div>

                {pinnedIds.length === 0 ? (
                  <div className="text-center py-16 bg-slate-900 rounded-2xl border border-slate-800">
                    <p className="text-xs text-slate-400 mb-4">今日意識する感覚がピン留めされていません。</p>
                    <button onClick={() => { setActiveTab('cards'); }} className="bg-emerald-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-400 transition-all">カルテからピン留めする</button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {cardList.filter(card => pinnedIds.includes(card.id)).map((card) => {
                      const isChecked = checkedPins[card.id] || false;
                      return (
                        <div key={card.id} className={`border rounded-xl p-4 transition-all ${isChecked ? 'bg-slate-950/60 border-slate-850 opacity-60 line-through' : 'bg-slate-900 border-slate-800 shadow-md'}`}>
                          <div className="flex items-start justify-between gap-3">
                            <div className="flex items-start gap-2.5 w-full">
                              {/* チェックボタン */}
                              <button onClick={() => setCheckedPins({...checkedPins, [card.id]: !isChecked})} className={`mt-1 flex items-center justify-center w-5 h-5 rounded-full border transition-all ${isChecked ? 'bg-emerald-500 border-emerald-500 text-slate-950' : 'border-slate-600'}`}><Icons.Check className="w-3.5 h-3.5 stroke-[3]" /></button>
                              
                              <div className="flex-1 min-w-0">
                                <div className="flex flex-wrap items-center gap-1.5">
                                  {card.clubs.map((c) => (<span key={c} className="text-[9px] bg-slate-950 text-slate-400 px-1.5 py-0.5 rounded font-bold">{c}</span>))}
                                  <span className="text-[10px] text-emerald-400 font-extrabold">{card.translatedConcept}</span>
                                  <span className="text-[9px] text-slate-500">({card.phase})</span>
                                </div>
                                <p className="text-sm font-medium text-slate-100 mt-2.5 leading-relaxed">「{card.sensation}」</p>
                                
                                {/* 未チェック状態の時だけ3D線人間プレビューとチェックポイント、トリガーアドバイスをスマート表示 */}
                                {!isChecked && (
                                  <div className="mt-4 space-y-3 animate-in fade-in duration-200">
                                    <SwingSkeleton3D phase={card.phase} showPlane={showPlaneGlobal} />
                                    
                                    <div className="grid grid-cols-1 gap-1.5 bg-slate-950/60 p-3 rounded-lg border border-slate-850">
                                      {card.checkpoints.map((cp, cIdx) => (
                                        <div key={cIdx} className="flex justify-between items-center text-[11px] text-slate-400">
                                          <span className="font-semibold">{cp.label}</span>
                                          <span className="font-extrabold text-slate-200">{cp.value}</span>
                                        </div>
                                      ))}
                                    </div>

                                    <div className="text-xs text-emerald-300 bg-emerald-950/10 p-2.5 rounded border border-emerald-500/10">
                                      <strong>再現トリガー:</strong> {card.actionAdvice}
                                    </div>
                                  </div>
                                )}
                              </div>
                            </div>
                            <button onClick={() => togglePin(card.id)} className="text-slate-500 hover:text-rose-400 transition-colors shrink-0"><Icons.X className="w-4 h-4" /></button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* --- トースト通知 --- */}
          {toast && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-slate-800 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 animate-in fade-in slide-in-from-bottom-5 duration-200">
              <Icons.CheckCircle2 className="w-4 h-4 text-emerald-400" />
              <span className="text-xs font-semibold">{toast.message}</span>
            </div>
          )}

          {/* --- フッターナビゲーション (モバイル用) --- */}
          <footer className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 border-t border-slate-800 py-3 px-6 flex justify-around items-center backdrop-blur-md">
            <button onClick={() => { setActiveTab('translator'); window.scrollTo(0, 0); }} className={`flex flex-col items-center gap-1 ${activeTab === 'translator' ? 'text-emerald-400' : 'text-slate-500'}`}><Icons.Sparkles className="w-5 h-5" /><span className="text-[10px] font-bold">AI翻訳</span></button>
            <button onClick={() => { setActiveTab('cards'); window.scrollTo(0, 0); }} className={`flex flex-col items-center gap-1 ${activeTab === 'cards' ? 'text-emerald-400' : 'text-slate-500'}`}><Icons.BookOpen className="w-5 h-5" /><span className="text-[10px] font-bold">カルテ</span></button>
            <button onClick={() => { setActiveTab('today'); window.scrollTo(0, 0); }} className={`flex flex-col items-center gap-1 ${activeTab === 'today' ? 'text-emerald-400' : 'text-slate-500'}`}><Icons.Target className="w-5 h-5" /><span className="text-[10px] font-bold">ピン留め</span></button>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
