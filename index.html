    function App() {
      // --- ステート管理 ---
      const [sensation, setSensation] = useState('');
      const [selectedClubs, setSelectedClubs] = useState(['アイアン']); // 複数選択に対応 (配列)
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [activeTab, setActiveTab] = useState('translator'); // 'translator', 'cards', 'today'
      const [cardList, setCardList] = useState([]);
      const [pinnedIds, setPinnedIds] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterClub, setFilterClub] = useState('ALL');
      const [filterIssue, setFilterIssue] = useState('ALL');
      const [currentResult, setCurrentResult] = useState(null);
      const [toast, setToast] = useState(null);
      const [checkedPins, setCheckedPins] = useState({});

      // API設定用の追加ステート
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('swingcodex_api_key') || '');
      const [showSettings, setShowSettings] = useState(false);

      // 利用可能なクラブ一覧
      const CLUB_OPTIONS = ['ドライバー', 'ウッド/UT', 'アイアン', 'ウェッジ', 'パター'];

      // 利用可能なスイングフェーズ
      const SWING_PHASES = ['アドレス', 'テイクバック', 'トップ', 'ダウンスイング', 'インパクト', 'フォロースルー'];

      // --- 初期サンプルデータ及びローカルストレージの読み込み ---
      useEffect(() => {
        // ローカルストレージに保存されたカルテ履歴がある場合はそちらを優先
        const savedCards = localStorage.getItem('swingcodex_cards');
        const savedPins = localStorage.getItem('swingcodex_pinned');
        
        if (savedCards) {
          try {
            setCardList(JSON.parse(savedCards));
          } catch(e) {
            console.error("Failed to load saved cards", e);
          }
        } else {
          // デフォルトカードの読み込み
          const defaultCards = [
            {
              id: 'sample-1',
              date: '2026/06/09',
              clubs: ['ドライバー', 'ウッド/UT'],
              issue: 'スライス防止',
              sensation: 'バックスイングで背中を完全に目標に向ける感覚。手先だけで上げずに、胸椎ごと右に回しきるイメージ。',
              phase: 'トップ',
              translatedConcept: '最大捻転（Xファクター）',
              checkpoints: [
                { label: "骨盤・肩の捻転差", value: "最大45度キープ", percentage: 95, description: "上半身と下半身のねじれ差を極大化させ、ダウンスイングの力強いエネルギー源を作ります。" },
                { label: "左肩の位置", value: "顎の下まで深く押し込む", percentage: 90, description: "手先でクラブを上げるのではなく、胸椎の回旋によってフラットな肩の回転軸を作ります。" },
                { label: "左手首のアライメント", value: "フラット（掌屈気味）", percentage: 85, description: "トップでのフェースの開きを抑制し、ハーフウェイダウンでのスクエアな戻りを保証します。" }
              ],
              anatomyAndPhysics: "背中を向ける感覚は、解剖学的に『広背筋』および『腹斜筋群』に強力な伸張反射（ストレッチ・ショートニング・サイクル）を引き起こします。これにより、手の力に頼らない『運動連鎖』が下半身からスムーズに始動し、クラブのインサイドアウト軌道が自然と形成されてスライスを根本から撲滅します。",
              focusScore: 94,
              actionAdvice: "右の股関節にしっかりと体重を乗せ、左膝を少し内側に送り込みながら背中のロゴを目標に見せるように始動します。"
            },
            {
              id: 'sample-2',
              date: '2026/06/08',
              clubs: ['アイアン', 'ウェッジ'],
              issue: '打点の安定',
              sensation: 'ボールの先3cmのゴミを一緒にアイアンの刃で払うイメージで、低く長くヘッドを出す。',
              phase: 'インパクト',
              translatedConcept: 'ハンドファースト・ローインパクト',
              checkpoints: [
                { label: "ハンドファースト角度", value: "目標方向に12°傾斜", percentage: 92, description: "ロフト角を立てて捉えることで、風に負けない厚いインパクトと極上の打感を生み出します。" },
                { label: "ヘッド最下点の位置", value: "ボールの先2.5cm", percentage: 88, description: "ダウンブロー軌道になり、芝の抵抗に負けずにクリーンに捉えることができます。" },
                { label: "前傾角度の維持率", value: "アドレスからブレ幅5%以内", percentage: 95, description: "インパクト時の早期の起き上がり（アーリーエクステンション）を防ぎ、トップやシャンクを根絶します。" }
              ],
              anatomyAndPhysics: "低く長く出す感覚は、スイングプレーンの低重心化とインパクトゾーンの長さを物理的に確保します。解剖学的には、左手首のコックがアーリーリリース（キャスティング）されるのを防ぎ、左肩甲骨の引き込み動作（大円筋・広背筋）で手元を低くコントロールしています。これにより打点の前後ブレが劇的に減少します。",
              focusScore: 96,
              actionAdvice: "インパクトゾーンで左手の甲が地面を向くように、腰を左後ろへ鋭く回転させ続けてください。"
            }
          ];
          setCardList(defaultCards);
          localStorage.setItem('swingcodex_cards', JSON.stringify(defaultCards));
        }

        if (savedPins) {
          try {
            setPinnedIds(JSON.parse(savedPins));
          } catch(e) {
            setPinnedIds(['sample-1']);
          }
        } else {
          setPinnedIds(['sample-1']);
        }
      }, []);

      // データのローカル永続化保存
      const saveCardsToStorage = (updatedList) => {
        setCardList(updatedList);
        localStorage.setItem('swingcodex_cards', JSON.stringify(updatedList));
      };

      const savePinsToStorage = (updatedPins) => {
        setPinnedIds(updatedPins);
        localStorage.setItem('swingcodex_pinned', JSON.stringify(updatedPins));
      };

      // APIキーの保存
      const saveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('swingcodex_api_key', key);
        showToast('APIキーをローカル保存しました');
        setShowSettings(false);
      };

      // --- トースト通知機能 ---
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // --- クリップボードへのコピー（iFrame安全対策用） ---
      const copyTextToClipboard = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.width = "2em";
        textArea.style.height = "2em";
        textArea.style.padding = "0";
        textArea.style.border = "none";
        textArea.style.outline = "none";
        textArea.style.boxShadow = "none";
        textArea.style.background = "transparent";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        try {
          const successful = document.execCommand('copy');
          if (successful) {
            showToast('クリップボードにコピーしました！');
          } else {
            showToast('コピーに失敗しました。もう一度お試しください。', 'error');
          }
        } catch (err) {
          showToast('コピー機能がサポートされていません。', 'error');
        }
        document.body.removeChild(textArea);
      };

      // --- カルテ内容を綺麗にテキストフォーマット化 ---
      const formatCarteToText = (card) => {
        return `【SwingCodex スイングカルテ】
■ 登録日: ${card.date}
■ 対象クラブ: ${card.clubs.join(', ')}
■ 検出課題: ${card.issue}
■ 該当フェーズ: ${card.phase}

■ あなたのスイング感覚:
「${card.sensation}」

■ 客観的翻訳コンセプト:
【${card.translatedConcept}】

■ 動作チェックポイント:
${card.checkpoints.map((cp, idx) => `${idx + 1}. ${cp.label}: ${cp.value}\n   (${cp.description})`).join('\n')}

■ バイオメカニクス ＆ スイング物理解説:
${card.anatomyAndPhysics}

■ 再現するためのトリガー動作:
${card.actionAdvice}

※再現スコア（物理的再現性）: ${card.focusScore}%`;
      };

      // --- クラブ複数選択のトグルロジック ---
      const handleClubToggle = (club) => {
        if (selectedClubs.includes(club)) {
          if (selectedClubs.length > 1) {
            setSelectedClubs(selectedClubs.filter(c => c !== club));
          } else {
            showToast('少なくとも1つのクラブを選択してください。', 'error');
          }
        } else {
          setSelectedClubs([...selectedClubs, club]);
        }
      };

      // 「すべてのクラブ」を一括トグル
      const handleAllClubsToggle = () => {
        if (selectedClubs.length === CLUB_OPTIONS.length) {
          setSelectedClubs(['アイアン']);
        } else {
          setSelectedClubs([...CLUB_OPTIONS]);
        }
      };

      // --- 感覚テキストから「課題・目的」を自動判定する内部ロジック (Fallback / API兼用) ---
      const autoDetectIssue = (text, clubs) => {
        const t = text.toLowerCase();
        
        if (t.includes("スライス") || t.includes("右") || t.includes("開く") || t.includes("脇") || t.includes("わき") || t.includes("タオル")) {
          return "スライス防止";
        }
        if (t.includes("フック") || t.includes("チーピン") || t.includes("左") || t.includes("閉じる") || t.includes("捕まる") || t.includes("つつまる")) {
          return "フック防止";
        }
        if (t.includes("飛距離") || t.includes("飛ばす") || t.includes("タメ") || t.includes("スピード") || t.includes("しなり") || t.includes("最大") || t.includes("背中") || t.includes("一瞬止まる")) {
          return "飛距離アップ";
        }
        if (t.includes("打点") || t.includes("ミート") || t.includes("ダフ") || t.includes("トップ") || t.includes("芯") || t.includes("クリーン") || t.includes("先")) {
          return "打点の安定";
        }

          {/* --- トースト通知 --- */}
          {toast && (
            <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-slate-800 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 animate-in fade-in slide-in-from-bottom-5 duration-200">
              {toast.type === 'success' ? (
                <Icons.CheckCircle2 className="w-4 h-4 text-emerald-400" />
              ) : toast.type === 'info' ? (
                <Icons.Info className="w-4 h-4 text-cyan-400" />
              ) : (
                <Icons.AlertCircle className="w-4 h-4 text-rose-400" />
              )}
              <span className="text-xs font-semibold">{toast.message}</span>
            </div>
          )}

          {/* --- フッターナビゲーション (モバイル用) --- */}
          <footer className="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 border-t border-slate-800 py-3 px-6 flex justify-around items-center backdrop-blur-md">
            <button 
              onClick={() => { setActiveTab('translator'); window.scrollTo(0, 0); }}
              className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'translator' ? 'text-emerald-400 scale-105' : 'text-slate-500 hover:text-slate-300'}`}
            >
              <Icons.Sparkles className="w-5 h-5" />
              <span className="text-[10px] font-bold">AI翻訳</span>
            </button>

            <button 
              onClick={() => { setActiveTab('cards'); window.scrollTo(0, 0); }}
              className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'cards' ? 'text-emerald-400 scale-105' : 'text-slate-500 hover:text-slate-300'}`}
            >
              <Icons.BookOpen className="w-5 h-5" />
              <span className="text-[10px] font-bold">カルテ</span>
            </button>

            <button 
              onClick={() => { setActiveTab('today'); window.scrollTo(0, 0); }}
              className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'today' ? 'text-emerald-400 scale-105' : 'text-slate-500 hover:text-slate-300'}`}
            >
              <Icons.Target className="w-5 h-5" />
              <span className="text-[10px] font-bold">ピン留め</span>
            </button>
          </footer>

        </div>
      );
    }

    // Render components
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
